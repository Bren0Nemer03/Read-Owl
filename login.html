<body>
  <div class="login-container">
    <div class="login-box"> <!-- Caixa branca -->
      <img src="img/readowl_logo.png.png" alt="Logo Read Owl" class="logo">
      <h2>Bem-vindo à <span>Read Owl</span></h2>
      <link rel="stylesheet" href="login.css">
      <p class="subtitle">Entre na sua conta para continuar</p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <button type="submit">Entrar</button>
      </form>

      <p class="register-link">
        Não tem uma conta?
        <a href="put.html">Cadastre-se aqui</a>
      </p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
